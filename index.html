<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idol Chat Space</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,"Microsoft YaHei",sans-serif;}
body{
  height:100vh;
  background:linear-gradient(135deg,#0f172a,#1e293b,#7c3aed);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}
.container{
  width:1200px;
  height:750px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border-radius:20px;
  display:flex;
  overflow:hidden;
}

/* 左侧idol列表 */
.sidebar{
  width:300px;
  background:rgba(0,0,0,0.25);
  padding:20px;
  overflow-y:auto;
}
.sidebar h2{
  text-align:center;
  margin-bottom:20px;
}
.idol{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-radius:12px;
  cursor:pointer;
  margin-bottom:10px;
  transition:0.3s;
}
.idol:hover{
  background:rgba(255,255,255,0.15);
}
.idol img{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
}

/* 聊天区 */
.chat-area{
  flex:1;
  display:flex;
  flex-direction:column;
}

.chat-header{
  height:80px;
  background:rgba(255,255,255,0.1);
  display:flex;
  align-items:center;
  padding:20px;
  gap:15px;
}
.chat-header img{
  width:55px;
  height:55px;
  border-radius:50%;
}

.chat-box{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.message{
  display:flex;
  margin-bottom:20px;
  align-items:flex-start;
}

.message img{
  width:45px;
  height:45px;
  border-radius:50%;
}

.bubble{
  max-width:60%;
  padding:12px 16px;
  border-radius:16px;
  margin:0 10px;
}

.idol-msg .bubble{
  background:#9333ea;
}

.user-msg{
  justify-content:flex-end;
}

.user-msg .bubble{
  background:#2563eb;
}

.input-area{
  height:80px;
  display:flex;
  padding:15px;
  gap:10px;
  background:rgba(255,255,255,0.08);
}

input{
  flex:1;
  border:none;
  border-radius:12px;
  padding:12px;
  font-size:16px;
}

button{
  width:100px;
  border:none;
  border-radius:12px;
  background:#ec4899;
  color:white;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

  <div class="sidebar">
    <h2>选择你的 Idol</h2>

    <div class="idol" onclick="selectIdol('Mark (NCT)','https://via.placeholder.com/100?text=Mark')">
      <img src="https://via.placeholder.com/100?text=Mark">
      <span>Mark（NCT）</span>
    </div>

    <div class="idol" onclick="selectIdol('Wonbin (RIIZE)','https://via.placeholder.com/100?text=Wonbin')">
      <img src="https://via.placeholder.com/100?text=Wonbin">
      <span>Wonbin（RIIZE）</span>
    </div>

    <div class="idol" onclick="selectIdol('Yeonjun (TXT)','https://via.placeholder.com/100?text=Yeonjun')">
      <img src="https://via.placeholder.com/100?text=Yeonjun">
      <span>Yeonjun（TXT）</span>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-header">
      <img id="idolAvatar" src="https://via.placeholder.com/100?text=Idol">
      <h2 id="idolName">请选择一个 Idol 开始聊天</h2>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="输入你想对idol说的话...">
      <button onclick="sendMessage()">发送</button>
    </div>
  </div>

</div>

<script>
let currentIdol = "";

const personaReplies = {
  "Mark (NCT)": "哈哈你这样说让我有点害羞，不过还是很开心和你聊天～",
  "Wonbin (RIIZE)": "你今天过得怎么样？记得好好吃饭，我会担心的。",
  "Yeonjun (TXT)": "你真的很有趣诶，再多和我聊聊吧 :)"
};

function selectIdol(name, avatar){
  currentIdol = name;
  document.getElementById('idolName').innerText = name;
  document.getElementById('idolAvatar').src = avatar;

  document.getElementById('chatBox').innerHTML = `
    <div class="message idol-msg">
      <img src="${avatar}">
      <div class="bubble">Hi~ 我是 ${name}，今天想聊什么？</div>
    </div>
  `;
}

function sendMessage(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text || !currentIdol) return;

  const chatBox = document.getElementById('chatBox');

  // 用户消息（使用你上传的头像）
  chatBox.innerHTML += `
    <div class="message user-msg">
      <div class="bubble">${text}</div>
      <img src="半身照.jpg">
    </div>
  `;

  setTimeout(()=>{
    chatBox.innerHTML += `
      <div class="message idol-msg">
        <img src="${document.getElementById('idolAvatar').src}">
        <div class="bubble">${personaReplies[currentIdol]}</div>
      </div>
    `;
    chatBox.scrollTop = chatBox.scrollHeight;
  },1000);

  input.value='';
}
</script>

</body>
</html>
